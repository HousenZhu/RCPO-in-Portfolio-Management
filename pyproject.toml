[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "rcpo-portfolio"
version = "0.1.0"
description = "Synthetic portfolio management with RCPO-style constrained reinforcement learning."
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
  "gymnasium>=0.29,<1.1",
  "matplotlib>=3.8,<4.0",
  "numpy>=1.26,<3.0",
  "pyyaml>=6.0,<7.0",
  "torch>=2.2,<3.0",
]

[project.optional-dependencies]
dev = [
  "pytest>=8.0,<9.0",
]

[tool.setuptools]
package-dir = {"" = "src"}

[tool.setuptools.packages.find]
where = ["src"]
