experiment:
  output_root: runs
  run_name: new
  seeds:
  - 0
runtime:
  device: cpu
market:
  num_risky_assets: 5
  lookback: 20
  train_market_count: 8
  train_steps: 5040
  validation_steps: 252
  test_steps: 252
  low_vol_drift: 0.0007
  high_vol_drift: -0.0004
  low_vol_scale: 0.008
  high_vol_scale: 0.02
  base_correlation: 0.25
  low_vol_correlation: 0.15
  high_vol_correlation: 0.55
  enable_learnable_structure: true
  regime_drift_adjustments:
    low_vol:
    - 0.0008
    - 0.00065
    - -0.0004
    - -0.00045
    - -0.00045
    high_vol:
    - -0.001
    - -0.0008
    - -0.0006
    - 0.0004
    - 0.0006
  momentum_strength: 0.2
  momentum_decay: 0.94
  momentum_clip: 0.01
  transition_matrix:
  - - 0.95
    - 0.05
  - - 0.1
    - 0.9
environment:
  episode_length: 252
  transaction_cost_bps: 1.0
  turnover_cap: 0.4
  constraint_mode: max_drawdown
  drawdown_budget_floor: 0.05
  benchmark_drawdown_margin: 0.96
  drawdown_cost_scale: 0.01
  diversification_beta: 0.0
  group_a_indices:
  - 0
  - 1
  group_b_indices:
  - 2
  - 3
  - 4
  active_constraint_preset: c2
  constraint_presets:
    c1:
      group_a_min_weight: 0.2
      group_b_max_weight: 0.7
    c2:
      group_a_min_weight: 0.25
      group_b_max_weight: 0.6
    c3:
      group_a_min_weight: 0.3
      group_b_max_weight: 0.5
  resolved_group_a_min_weight: 0.25
  resolved_group_b_max_weight: 0.6
  group_a_min_cost_weight: 0.35
  group_b_max_cost_weight: 0.35
network:
  hidden_sizes:
  - 128
  - 128
  activation: tanh
  init_log_std: -1.5
  min_log_std: -2.5
  equal_weight_policy_init: true
optimization:
  total_updates: 1000
  rollout_steps: 2048
  epochs: 4
  minibatch_size: 512
  learning_rate: 0.00023
  gamma: 0.99
  gae_lambda: 0.95
  clip_epsilon: 0.15
  entropy_coef: 0.0005
  reward_value_coef: 0.5
  cost_value_coef: 0.5
  max_grad_norm: 0.5
  learning_rate_final: 4.0e-05
  target_kl: 0.02
  early_stop_patience: null
  early_stop_min_delta: 0.001
ppo:
  total_updates: 2000
  rollout_steps: 2048
  epochs: 4
  minibatch_size: 512
  learning_rate: 0.0004
  learning_rate_final: 0.0002
  gamma: 0.99
  gae_lambda: 0.95
  clip_epsilon: 0.15
  entropy_coef: 0.0002
  reward_value_coef: 0.5
  cost_value_coef: 0.0
  max_grad_norm: 0.5
  target_kl: 0.02
  early_stop_patience: null
  early_stop_min_delta: 0.001
rcpo:
  initial_lambda: 0.0
  lambda_lr: 0.05
  lambda_lr_up: 0.015
  lambda_lr_down: 0.03
  alpha: null
  alpha_budget_ratio: 0.05
  constraint_mode: max_drawdown
reward_correction:
  mode: none
  reward_min: -0.04
  reward_max: 0.07
  hidden_sizes:
  - 128
  - 128
  learning_rate: 0.001
  train_epochs_per_update: 3
  num_bins: 21
  gdrc_num_candidates: 6
  gdrc_vote_decay: 0.9
  gdrc_range_window_updates: 10
  gdrc_range_percentiles:
  - 0.5
  - 99.5
evaluation:
  episodes: 1
  deterministic: true
  rolling_risk_window: 20
  validation_branch_count: 5
  test_branch_count: 10
  validation_interval_updates: 5
  checkpoint_score: validation_mean_excess_cumulative_return
