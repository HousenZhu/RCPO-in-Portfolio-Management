experiment:
  output_root: runs
  run_name: latest
  seeds:
  - 0
market:
  num_risky_assets: 5
  lookback: 20
  train_steps: 22000
  validation_steps: 900
  test_steps: 900
  low_vol_drift: 0.0007
  high_vol_drift: -0.0004
  low_vol_scale: 0.008
  high_vol_scale: 0.02
  base_correlation: 0.25
  transition_matrix:
  - - 0.95
    - 0.05
  - - 0.1
    - 0.9
environment:
  episode_length: 252
  transaction_cost_bps: 10.0
  per_asset_exposure_cap: 0.45
  gross_exposure_cap: 1.2
  short_exposure_cap: 0.25
  turnover_cap: 0.4
  cash_floor: -0.2
  borrow_fee_bps: 2.0
  financing_rate_bps: 1.0
  turnover_penalty_bps: 1.0
  downside_cost_weight: 1.0
  exposure_cost_weight: 0.25
  turnover_cost_weight: 0.2
  margin_cost_weight: 0.15
  margin_call_gross_exposure: 1.6
  portfolio_value_floor: 0.6
network:
  hidden_sizes:
  - 128
  - 128
  activation: tanh
  init_log_std: -0.5
optimization:
  total_updates: 200
  rollout_steps: 1024
  epochs: 8
  minibatch_size: 256
  learning_rate: 0.0003
  gamma: 0.99
  gae_lambda: 0.95
  clip_epsilon: 0.2
  entropy_coef: 0.001
  reward_value_coef: 0.5
  cost_value_coef: 0.5
  max_grad_norm: 0.5
rcpo:
  initial_lambda: 0.0
  lambda_lr: 0.05
  alpha: null
  calibration_episodes: 8
  calibration_scale: 0.9
evaluation:
  episodes: 5
  deterministic: true
  rolling_risk_window: 20
