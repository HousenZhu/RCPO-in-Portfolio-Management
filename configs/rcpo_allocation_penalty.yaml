experiment:
  output_root: runs
  run_name: rcpo_allocation_penalty
  seeds: [0]

runtime:
  device: cpu

market:
  num_risky_assets: 5
  lookback: 20
  train_market_count: 8
  train_steps: 5040
  validation_steps: 252
  test_steps: 252
  low_vol_drift: 0.0007
  high_vol_drift: -0.0004
  low_vol_scale: 0.008
  high_vol_scale: 0.02
  base_correlation: 0.25
  low_vol_correlation: 0.15
  high_vol_correlation: 0.55
  enable_learnable_structure: true
  regime_drift_adjustments:
    low_vol: [0.00080, 0.00065, -0.00040, -0.00045, -0.00045]
    high_vol: [-0.00100, -0.00080, -0.00060, 0.00040, 0.00060]
  momentum_strength: 0.20
  momentum_decay: 0.94
  momentum_clip: 0.01
  transition_matrix:
    - [0.95, 0.05]
    - [0.10, 0.90]

environment:
  action_mode: softmax
  simplex_action_format: branch_logits
  initial_portfolio_mode: constrained_neutral
  episode_length: 252
  transaction_cost_bps: 1.0
  turnover_cap: 0.40
  constraint_mode: allocation
  drawdown_budget_floor: 0.05
  drawdown_benchmark_mode: constrained_neutral
  benchmark_drawdown_margin: 0.95
  drawdown_cost_scale: 0.10
  allocation_constraint_cost_scale: 20.0
  diversification_beta: 0.0
  allocation_constraint_1_indices: [1, 3, 5]
  allocation_constraint_2_indices: [4, 5]
  active_constraint_preset: c3
  constraint_presets:
    c1:
      allocation_constraint_1_min_weight: 0.35
      allocation_constraint_2_min_weight: 0.35
    c2:
      allocation_constraint_1_min_weight: 0.40
      allocation_constraint_2_min_weight: 0.40
    c3:
      allocation_constraint_1_min_weight: 0.55
      allocation_constraint_2_min_weight: 0.55

network:
  policy_architecture: flat_gaussian
  branch_credit_mode: global
  hidden_sizes: [128, 128]
  activation: tanh
  init_log_std: -1.5
  min_log_std: -2.5
  equal_weight_policy_init: true
  dirichlet_min_concentration: 0.3
  dirichlet_init_concentration: 2.0
  dirichlet_max_concentration: 12.0

optimization:
  total_updates: 8000
  rollout_steps: 2048
  epochs: 4
  minibatch_size: 512
  learning_rate: 0.0002
  learning_rate_final: 0.0002
  gamma: 0.99
  gae_lambda: 0.95
  clip_epsilon: 0.15
  entropy_coef: 0.001
  reward_value_coef: 0.5
  cost_value_coef: 0.5
  max_grad_norm: 0.5
  target_kl: 0.02
  early_stop_patience:
  early_stop_min_delta: 0.001

ppo:
  total_updates: 8000
  rollout_steps: 2048
  epochs: 4
  minibatch_size: 512
  learning_rate: 0.0002
  learning_rate_final: 0.0002
  gamma: 0.99
  gae_lambda: 0.95
  clip_epsilon: 0.15
  entropy_coef: 0.001
  reward_value_coef: 0.5
  cost_value_coef: 0.0
  max_grad_norm: 0.5
  target_kl: 0.02
  early_stop_patience:
  early_stop_min_delta: 0.001

rcpo:
  initial_lambda: 0.0
  lambda_lr: 0.03
  lambda_lr_up: 0.0015
  lambda_lr_down: 0.03
  alpha: 0.0005
  alpha_budget_ratio: 0.05
  constraint_mode: allocation

reward_correction:
  mode: none

reward_noise:
  enabled: false
  mode: gaussian
  std: 0.003
  seed_offset: 30000

evaluation:
  episodes: 1
  deterministic: true
  rolling_risk_window: 20
  validation_branch_count: 5
  test_branch_count: 10
  validation_interval_updates: 10
  checkpoint_score: validation_mean_excess_cumulative_return
