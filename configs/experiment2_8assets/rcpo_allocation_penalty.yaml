extends: base.yaml

experiment:
  run_name: experiment2_8assets_rcpo_allocation_penalty

environment:
  action_mode: softmax
  simplex_action_format: branch_logits
  constraint_mode: allocation

network:
  policy_architecture: flat_gaussian
  branch_credit_mode: global

optimization:
  total_updates: 80000
  rollout_steps: 2048
  epochs: 3
  minibatch_size: 512
  learning_rate: 0.0001
  learning_rate_final: 0.00003
  clip_epsilon: 0.10
  entropy_coef: 0.001
  target_kl: 0.02

rcpo:
  initial_lambda: 0.0
  lambda_lr_up: 0.001
  lambda_lr_down: 0.03
  alpha: 0.0001
  alpha_budget_ratio: 0.04
  constraint_mode: allocation
